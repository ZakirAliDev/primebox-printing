services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: primebox
      MYSQL_DATABASE: primebox
      MYSQL_USER: primebox
      MYSQL_PASSWORD: primebox
    volumes:
      - primebox_mysql:/var/lib/mysql
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uprimebox", "-pprimebox"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  primebox_mysql:
